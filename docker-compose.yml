# Local development stack: the Rails app plus a Postgres it can reach over TCP.
# Run it with:  docker compose up
# One-off commands:  docker compose run --rm web bin/rails test
#
# DATABASE_URL points Rails at the db service; the per-environment database name
# still comes from config/database.yml (Rails merges the URL over it), so dev and
# test each get their own database without editing that file.
name: hookrelay

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Clear any stale PID first: the server writes tmp/pids/server.pid, and
    # because tmp/ is bind-mounted it survives `docker compose down`, which would
    # otherwise make the next `up` refuse to start.
    command: bash -c "rm -f tmp/pids/server.pid && (bundle check || bundle install) && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
